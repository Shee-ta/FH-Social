server.port=3000
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/fh_social}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fh_social}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fh_social}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

app.jwt.secret=${APP_JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:3600}

spring.sql.init.mode=always

spring.ai.model.chat=google-genai

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash
spring.ai.google.genai.chat.temperature=0.0
