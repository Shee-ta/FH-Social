server.port=3000
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/fh_social}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fh_social}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fh_social}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

app.jwt.secret=${APP_JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:30758400}

spring.sql.init.mode=always

# AI provider: "google-genai" or "ollama". Override via AI_PROVIDER.
spring.ai.model.chat=${AI_PROVIDER:ollama}

# --- Google Gemini ---
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash
spring.ai.google.genai.chat.temperature=0.0

# --- Local Ollama ---
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://host.docker.internal:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:phi4-mini:latest}
spring.ai.ollama.chat.options.temperature=0.0
spring.ai.ollama.init.pull-model-strategy=never
